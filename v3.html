<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P7 Genetic Catalog Manager • V4</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap');
        :root { 
            --bg: #0f172a; 
            --card: #1e2937; 
            --accent: #22d3ee; 
            --text: #e2e8f0; 
            --text-light: #94a3b8; 
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 16px; 
            line-height: 1.6; 
            font-size: 15px; 
            -webkit-tap-highlight-color: transparent;
        }
        h1 { 
            font-family: 'Press Start 2P', system-ui; 
            text-align: center; 
            font-size: 22px; 
            margin: 0 0 4px; 
            color: var(--accent); 
            letter-spacing: -1px;
        }
        .last-updated { 
            text-align: center; 
            color: var(--text-light); 
            font-size: 13px; 
            margin-bottom: 12px; 
        }
        .note { 
            text-align: center; 
            color: var(--text-light); 
            font-size: 13px; 
            margin-bottom: 20px; 
            font-style: italic;
        }

        .dashboard-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); 
            gap: 16px; 
            margin-bottom: 28px; 
        }
        .dashboard-grid > div { 
            background: #1e2937; 
            padding: 20px; 
            border-radius: 14px; 
            text-align: center; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .controls-top { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        .controls-top button {
            font-size: 13px;
            padding: 12px 10px;
            min-height: 48px;
            line-height: 1.3;
        }

        .tab-header { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 16px; 
            border-bottom: 3px solid #334155; 
            flex-wrap: wrap; 
            padding-bottom: 6px; 
        }
        .tab-btn { 
            padding: 12px 18px; 
            font-size: 15px; 
            background: #334155; 
            border: none; 
            border-radius: 8px 8px 0 0; 
            cursor: pointer; 
            flex: 1; 
            min-width: 110px; 
            transition: all 0.2s; 
            -webkit-appearance: none;
            touch-action: manipulation;
        }
        .tab-btn.active { 
            background: #1e2937; 
            border-bottom: 4px solid var(--accent); 
            color: var(--accent); 
            font-weight: 600; 
        }

        .controls-bottom { 
            display: flex; 
            justify-content: center; 
            margin-bottom: 28px; 
        }

        button { 
            background: #334155; 
            color: white; 
            border: none; 
            padding: 14px 16px; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            font-size: 14px; 
            -webkit-appearance: none;
            touch-action: manipulation;
        }
        button:hover, button:active { 
            background: var(--accent); 
            color: #0f172a; 
            transform: translateY(-2px); 
            box-shadow: 0 8px 15px -3px rgba(34, 211, 238, 0.3);
        }
        .add-btn { 
            background: #22d3ee; 
            color: #0f172a; 
            font-size: 17px; 
            padding: 18px 32px; 
            border-radius: 9999px; 
            box-shadow: 0 10px 15px -3px rgba(34, 211, 238, 0.4);
        }

        .product-list { margin-bottom: 30px; }
        .product-item { 
            background: var(--card); 
            border-radius: 16px; 
            margin-bottom: 16px; 
            padding: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            gap: 20px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
        }
        .product-item.archived { 
            opacity: 0.7; 
            filter: grayscale(60%); 
        }
        .product-info { 
            flex: 1; 
            min-width: 0; 
        }
        .product-name { 
            font-weight: 700; 
            font-size: 17px; 
            color: var(--text); 
            margin-bottom: 8px; 
            line-height: 1.3;
            word-break: break-word;
        }
        .product-desc { 
            font-size: 14px; 
            color: var(--text-light); 
            margin-bottom: 12px; 
            line-height: 1.5;
        }
        .product-meta {
            font-size: 13px;
            color: var(--text-light);
            line-height: 1.5;
            background: #0f172a;
            padding: 10px 12px;
            border-radius: 8px;
        }
        .trait-badges { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            margin-top: 12px; 
        }
        .trait-badge { 
            display: inline-block; 
            padding: 3px 10px; 
            border-radius: 9999px; 
            font-size: 12px; 
            font-weight: 600; 
        }
        .high { background: #4ade80; color: #0f172a; }
        .medium { background: #fbbf24; color: #0f172a; }
        .low { background: #f87171; color: #0f172a; }
        .neutral { background: #64748b; color: #e2e8f0; }
        .warning-badge { 
            background: #ef4444; 
            color: white; 
            padding: 3px 10px; 
            border-radius: 9999px; 
            font-size: 12px; 
            font-weight: 700; 
        }
        .info-badge {
            background: #64748b;
            color: white;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 11.5px;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            min-width: 110px;
        }
        .edit-btn { 
            background: #22d3ee; 
            color: #0f172a; 
            padding: 11px 18px; 
            border-radius: 8px; 
            font-size: 13.5px; 
            font-weight: 700; 
            -webkit-appearance: none;
            touch-action: manipulation;
        }
        .rare-btn { 
            background: #64748b; 
            color: white; 
            font-size: 12.5px; 
            padding: 8px 16px; 
            border-radius: 9999px; 
        }
        .rare-btn.active { 
            background: #a78bfa; 
            color: #0f172a; 
        }

        .modal-content { 
            background: #1e2937; 
            color: #e2e8f0; 
            padding: 28px; 
            border-radius: 16px; 
            max-width: 920px; 
            margin: 20px auto; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); 
            width: 100%;
        }
        select, input, textarea { 
            background: #0f172a; 
            color: #e2e8f0; 
            border: 1px solid #475569; 
            border-radius: 8px; 
            padding: 12px 14px; 
            width: 100%; 
            margin-bottom: 14px; 
            font-size: 15px;
        }
        label { 
            display: block; 
            font-size: 13.5px; 
            color: var(--text-light); 
            margin-bottom: 6px; 
            font-weight: 600; 
        }
        .history-item { 
            font-size: 13.5px; 
            color: var(--text-light); 
            margin-bottom: 6px; 
            padding-left: 4px;
        }

        .modal-overlay {
            position:fixed;
            inset:0;
            background:rgba(15,23,42,0.96);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:9999;
            padding:16px;
        }
        .alert-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>P7 Genetic Catalog Manager</h1>
    <div id="lastUpdated" class="last-updated">Last Updated: Never</div>
    <p class="note">V4 • Rotation after 3 clone sessions • Smart mother tags</p>

    <div id="dashboard-view" class="dashboard-grid">
        <div><h3 style="margin:0 0 8px 0;color:#67e8f9;">Mothers Due</h3><div id="due-mothers" style="font-size:34px;font-weight:700;color:#f97316;">0</div></div>
        <div><h3 style="margin:0 0 8px 0;color:#67e8f9;">Active Clones</h3><div id="active-clones" style="font-size:34px;font-weight:700;color:#67e8f9;">0</div></div>
        <div><h3 style="margin:0 0 8px 0;color:#67e8f9;">Rare Backups</h3><div id="rare-backups" style="font-size:34px;font-weight:700;color:#a78bfa;">0</div></div>
        <div><h3 style="margin:0 0 8px 0;color:#67e8f9;">Orphan Genetics</h3><div id="orphan-genetics" style="font-size:34px;font-weight:700;color:#f59e0b;">0</div></div>
    </div>

    <div id="alert-list" style="margin:16px 0 24px 0;" class="alert-stack"></div>

    <div class="controls-top">
        <button onclick="showGeneticLibrary()">🌱 Genetic Library</button>
        <button onclick="importFile()">📥 Import JSON</button>
        <button onclick="exportFile()">📤 Export JSON</button>
        <button onclick="copyPropagationSMS()">📱 Propagation Ready</button>
        <button onclick="copyAllClonesList()">📋 Current Clones</button>
        <button onclick="copyGeneticsList()">🌱 Full Catalog</button>
    </div>

    <div class="tab-header" id="main-tabs">
        <button class="tab-btn active" onclick="switchTab(2)">👩‍🌾 Mothers</button>
        <button class="tab-btn" onclick="switchTab(3)">🌱 Clones</button>
        <button class="tab-btn" onclick="switchTab(4)">📦 Archive</button>
    </div>

    <div class="controls-bottom" id="add-controls">
        <button onclick="addNewItem()" class="add-btn" id="add-btn-text">+ Add New Item</button>
    </div>

    <div id="productList" class="product-list"></div>

    <input type="file" id="fileInput" accept=".json" style="display:none;">

    <script>
        let genetics = [];
        let mothers = [];
        let clones = [];
        let currentTab = 2;
        let lastUpdated = null;

        const clonePhases = ["Cutting", "Rooting", "Rooted", "Veg/Transplanted", "Solo Cup / Ready", "Retail", "Flowering", "Replenish Moms"];

        function updateLastUpdated() {
            lastUpdated = new Date();
            document.getElementById('lastUpdated').textContent = `Last Updated: ${lastUpdated.toLocaleString()}`;
        }

        function saveToLocal() {
            localStorage.setItem('p7GeneticData', JSON.stringify({genetics, mothers, clones, version: "4"}));
        }

        function loadFromLocal() {
            const saved = localStorage.getItem('p7GeneticData');
            if (saved) {
                const parsed = JSON.parse(saved);
                genetics = parsed.genetics || [];
                mothers = parsed.mothers || [];
                clones = parsed.clones || [];
            }
        }

        function getDaysSinceClone(m) {
            if (!m.lastCloneDate || m.lastCloneDate === "") return null;
            return Math.floor((Date.now() - new Date(m.lastCloneDate)) / 86400000);
        }

        function getTotalClonesTaken(m) {
            if (!m.cloneHistory || !Array.isArray(m.cloneHistory)) return 0;
            return m.cloneHistory.reduce((sum, entry) => sum + (entry.qty || 0), 0);
        }

        function getCloneSessions(m) {
            return m.cloneHistory ? m.cloneHistory.length : 0;
        }

        function getActiveMothersForGenetic(geneticId) {
            return mothers.filter(m => m.geneticId === geneticId && m.status !== 'Archived').length;
        }

        function getOrphanGeneticsCount() {
            return genetics.filter(g => getActiveMothersForGenetic(g.id) === 0).length;
        }

        function generateMotherTag(geneticName, geneticId) {
            // Create smart prefix from genetic name (first letters of words, max 4 chars)
            let prefix = geneticName
                .split(/[\s-]+/)
                .map(word => word[0] ? word[0].toUpperCase() : '')
                .join('')
                .slice(0, 4);
            
            if (prefix.length < 2) {
                prefix = geneticName.slice(0, 4).toUpperCase();
            }

            // Count existing mothers for this genetic
            const existingCount = mothers.filter(m => m.geneticId === geneticId && m.status !== 'Archived').length;
            const nextNumber = existingCount + 1;

            return `MOM-${prefix}-${String(nextNumber).zfill(3)}`;
        }

        function renderList() {
            const container = document.getElementById('productList');
            container.innerHTML = '';

            if (currentTab === 2) { // Mothers
                document.getElementById('add-btn-text').innerHTML = '+ Add Mother';
                mothers.forEach((m, i) => {
                    if (m.status === 'Archived') return;
                    const genetic = genetics.find(g => g.id === m.geneticId) || {name: 'Unknown'};
                    const daysSince = getDaysSinceClone(m);
                    const sessions = getCloneSessions(m);
                    const showRotationWarning = sessions >= 3;
                    const showCloneWarning = daysSince !== null && daysSince > 30;
                    const pruneCount = m.pruneHistory ? m.pruneHistory.length : 0;
                    const totalClones = getTotalClonesTaken(m);
                    const rareLabel = m.isRare ? ' ⭐ Rare' : '';

                    const div = document.createElement('div');
                    div.className = 'product-item';
                    div.innerHTML = `
                        <div class="product-info">
                            <div class="product-name">${m.tag} — ${genetic.name}${rareLabel}</div>
                            <div class="product-desc">Health: ${m.health} • Location: ${m.location || '—'}</div>
                            <div class="product-meta">
                                Clone sessions: ${sessions} • Last clone: ${m.lastCloneDate || 'Never'}<br>
                                Last prune: ${m.lastPruneDate || 'Never'}<br>
                                Prunes: ${pruneCount} • Total clones: ${totalClones}
                            </div>
                            ${showRotationWarning ? `<span class="warning-badge" style="margin-top:8px;display:inline-block;">🔄 Due for rotation (3+ sessions)</span>` : ''}
                            ${showCloneWarning ? `<span class="warning-badge" style="margin-top:8px;display:inline-block;">⚠️ No clone in ${daysSince} days</span>` : ''}
                        </div>
                        <div class="action-buttons">
                            <button class="rare-btn ${m.isRare ? 'active' : ''}" onclick="toggleRare(${i}); event.stopImmediatePropagation();">⭐ Rare</button>
                            <button class="edit-btn" onclick="pruneMother(${i}); event.stopImmediatePropagation();">✂️ Prune</button>
                            <button class="edit-btn" onclick="editMother(${i}); event.stopImmediatePropagation();">Manage</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
                if (mothers.filter(m => m.status !== 'Archived').length === 0) {
                    container.innerHTML = `<div style="padding:60px 20px;text-align:center;color:#64748b;font-size:15px;">No active mothers yet.<br><span style="font-size:13px;">Add your first mother from the + button</span></div>`;
                }
            } 
            else if (currentTab === 3) { // Clones
                document.getElementById('add-btn-text').innerHTML = '+ Take Clones';
                clones.forEach((c, i) => {
                    if (c.isArchived) return;
                    const genetic = genetics.find(g => g.id === c.geneticId) || {name: 'Unknown'};
                    const isMultiMom = (c.sourceMothers && c.sourceMothers.length > 1);
                    const sourceInfo = isMultiMom ? `<br><small style="color:#a78bfa;">Multi-mom: ${c.sourceMothers.join(', ')}</small>` : '';
                    const displayName = genetic.name + sourceInfo;
                    const qtyBreakdown = c.quantityBreakdown ? Object.entries(c.quantityBreakdown).map(([m,q]) => `${m}: ${q}`).join(' + ') : c.quantity;

                    const div = document.createElement('div');
                    div.className = 'product-item';
                    div.innerHTML = `
                        <div class="product-info">
                            <div class="product-name">Batch #${c.id} — ${displayName}</div>
                            <div class="product-desc">Phase: <strong>${c.status}</strong> • Total Qty: <strong>${c.quantity}</strong></div>
                            <div class="product-meta">
                                Breakdown: ${qtyBreakdown}<br>
                                Purpose: ${c.purpose || 'Not set'}<br>
                                Cut date: ${c.cutDate}
                            </div>
                        </div>
                        <div class="action-buttons">
                            <button class="edit-btn" onclick="editClone(${i}); event.stopImmediatePropagation();">Manage Batch</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
                if (clones.filter(c => !c.isArchived).length === 0) {
                    container.innerHTML = `<div style="padding:60px 20px;text-align:center;color:#64748b;font-size:15px;">No active clones yet.<br><span style="font-size:13px;">Take clones from mothers to get started</span></div>`;
                }
            } 
            else if (currentTab === 4) { // Archive
                let html = '<h3 style="color:#64748b;margin:20px 0 12px 0;font-size:17px;">Archived Mothers</h3>';
                let hasArchivedMoms = false;
                mothers.forEach((m, idx) => {
                    if (m.status !== 'Archived') return;
                    hasArchivedMoms = true;
                    const genetic = genetics.find(g => g.id === m.geneticId) || {name: 'Unknown'};
                    html += `
                        <div class="product-item archived">
                            <div class="product-info">
                                <div class="product-name">${m.tag} — ${genetic.name}</div>
                                <div class="product-desc">Health: ${m.health} • Location: ${m.location || '—'}</div>
                            </div>
                            <div class="action-buttons">
                                <button class="edit-btn" onclick="toggleArchiveMother(${idx}); event.stopImmediatePropagation();">Restore</button>
                            </div>
                        </div>`;
                });
                if (!hasArchivedMoms) html += '<div style="padding:40px;text-align:center;color:#64748b;">No archived mothers yet.</div>';

                html += '<h3 style="color:#64748b;margin:40px 0 12px 0;font-size:17px;">Archived Clones</h3>';
                let hasArchivedClones = false;
                clones.forEach((c, idx) => {
                    if (!c.isArchived) return;
                    hasArchivedClones = true;
                    const genetic = genetics.find(g => g.id === c.geneticId) || {name: 'Unknown'};
                    const isMultiMom = (c.sourceMothers && c.sourceMothers.length > 1);
                    const sourceInfo = isMultiMom ? `<br><small style="color:#a78bfa;">Multi-mom: ${c.sourceMothers.join(', ')}</small>` : '';
                    const displayName = genetic.name + sourceInfo;
                    const qtyBreakdown = c.quantityBreakdown ? Object.entries(c.quantityBreakdown).map(([m,q]) => `${m}: ${q}`).join(' + ') : c.quantity;
                    html += `
                        <div class="product-item archived">
                            <div class="product-info">
                                <div class="product-name">Batch #${c.id} — ${displayName}</div>
                                <div class="product-desc">Phase: ${c.status} • Qty: ${qtyBreakdown}</div>
                            </div>
                            <div class="action-buttons">
                                <button class="edit-btn" onclick="toggleArchiveClone(${idx}); event.stopImmediatePropagation();">Restore</button>
                            </div>
                        </div>`;
                });
                if (!hasArchivedClones) html += '<div style="padding:40px;text-align:center;color:#64748b;">No archived clones yet.</div>';
                container.innerHTML = html;
            }
        }

        function showGeneticLibrary() {
            currentTab = 0;
            document.getElementById('productList').style.display = 'block';
            document.getElementById('add-controls').style.display = 'flex';
            document.getElementById('add-btn-text').innerHTML = '+ Add New Genetic';
            renderGeneticLibrary();
        }

        function renderGeneticLibrary() {
            const container = document.getElementById('productList');
            container.innerHTML = '';
            genetics.forEach((g, i) => {
                const momCount = getActiveMothersForGenetic(g.id);
                const momBadge = momCount > 0 
                    ? `<span class="info-badge" style="margin-left:8px;">${momCount} mom${momCount>1?'s':''}</span>` 
                    : `<span class="warning-badge" style="margin-left:8px;">No moms</span>`;
                
                const div = document.createElement('div');
                div.className = 'product-item';
                const badges = `
                    ${g.vigor ? `<span class="trait-badge ${g.vigor === 'High' ? 'high' : g.vigor === 'Medium' ? 'medium' : 'low'}">${g.vigor} Vigor</span>` : ''}
                    ${g.rootingEase ? `<span class="trait-badge neutral">${g.rootingEase}</span>` : ''}
                    ${g.flowerType ? `<span class="trait-badge neutral">${g.flowerType}</span>` : ''}
                    ${g.yieldPotential ? `<span class="trait-badge ${g.yieldPotential === 'High' ? 'high' : g.yieldPotential === 'Medium' ? 'medium' : 'low'}">${g.yieldPotential} Yield</span>` : ''}
                    ${g.structure ? `<span class="trait-badge neutral">${g.structure}</span>` : ''}
                    ${g.floweringWeeks ? `<span class="trait-badge neutral">${g.floweringWeeks}w</span>` : ''}
                    ${g.thc ? `<span class="trait-badge neutral">THC ${g.thc}</span>` : ''}
                    ${g.cbd ? `<span class="trait-badge neutral">CBD ${g.cbd}</span>` : ''}
                `;
                div.innerHTML = `
                    <div class="product-info">
                        <div class="product-name">${g.name || 'Unnamed Strain'}${momBadge}</div>
                        <div class="product-desc">${g.lineage || ''}</div>
                        <div class="trait-badges">${badges}</div>
                        <div onclick="showGeneticDetails(${i}); event.stopImmediatePropagation();" style="margin-top:12px;font-size:13.5px;color:var(--accent);text-decoration:underline;cursor:pointer;">View Full Details →</div>
                    </div>
                    <div class="action-buttons">
                        <button class="edit-btn" onclick="editGenetic(${i}); event.stopImmediatePropagation();">Edit</button>
                    </div>
                `;
                container.appendChild(div);
            });
            if (genetics.length === 0) {
                container.innerHTML = `<div style="padding:60px 20px;text-align:center;color:#64748b;font-size:15px;">No genetics in the catalog yet.<br><span style="font-size:13px;">Click + Add New Genetic to get started</span></div>`;
            }
        }

        function showGeneticDetails(i) {
            const g = genetics[i];
            const modalHTML = `
            <div class="modal-content">
                <h3 style="color:#22d3ee;margin-bottom:20px;">${g.name || 'Unnamed Strain'}</h3>
                <div style="background:#0f172a;padding:18px;border-radius:10px;margin-bottom:16px;">
                    <strong>Lineage:</strong> ${g.lineage || '—'}<br>
                    <strong>Vigor:</strong> ${g.vigor || '—'}<br>
                    <strong>Rooting Ease:</strong> ${g.rootingEase || '—'}<br>
                    <strong>Flower Type:</strong> ${g.flowerType || '—'}<br>
                    <strong>Yield Potential:</strong> ${g.yieldPotential || '—'}<br>
                    <strong>Structure:</strong> ${g.structure || '—'}<br>
                    <strong>Flowering Weeks:</strong> ${g.floweringWeeks || '—'}<br>
                    <strong>THC:</strong> ${g.thc || '—'}<br>
                    <strong>CBD:</strong> ${g.cbd || '—'}
                </div>
                <div style="background:#0f172a;padding:18px;border-radius:10px;margin-bottom:16px;">
                    <strong>Key Terpenes:</strong><br>${g.terpenes || 'No terpenes listed'}
                </div>
                <div style="background:#0f172a;padding:18px;border-radius:10px;">
                    <strong>Full Notes:</strong><br>${g.notes || 'No notes added'}
                </div>
                <div style="text-align:right;margin-top:24px;">
                    <button onclick="hideModal()" style="background:#22d3ee;color:#0f172a;padding:14px 40px;border-radius:9999px;font-weight:700;">Close</button>
                </div>
            </div>`;
            showModal(modalHTML);
        }

        function addNewItem() {
            if (currentTab === 0) addGenetic();
            else if (currentTab === 2) addMother();

        function createMultiMotherClone() {
            const selected = [];
            let totalQty = 0;
            const quantityBreakdown = {};
            const geneticSet = new Set();

            mothers.forEach((m, idx) => {
                const checked = document.getElementById(`check-${idx}`);
                if (checked && checked.checked) {
                    const qty = parseInt(document.getElementById(`qty-${idx}`).value) || 0;
                    if (qty > 0) {
                        selected.push(m);
                        quantityBreakdown[m.tag] = qty;
                        totalQty += qty;
                        if (!m.cloneHistory) m.cloneHistory = [];
                        m.cloneHistory.unshift({date: new Date().toISOString().split('T')[0], qty: qty});
                        m.lastCloneDate = new Date().toISOString().split('T')[0];
                        geneticSet.add(m.geneticId);
                    }
                }
            });

            if (selected.length === 0) return alert("Select at least one mother and enter quantity.");
            if (geneticSet.size > 1) return alert("Cannot mix mothers from different genetics in one batch.");

            const firstMother = selected[0];
            const sourceTags = selected.map(m => m.tag);
            const newClone = { 
                id: Date.now(), 
                geneticId: firstMother.geneticId, 
                sourceMothers: sourceTags, 
                quantityBreakdown: quantityBreakdown,
                cutDate: new Date().toISOString().split('T')[0], 
                status: "Cutting", 
                purpose: "", 
                quantity: totalQty, 
                isBackup: false, 
                progressNotes: "",
                isArchived: false
            };
            clones.unshift(newClone);
            hideModal();
            switchTab(3);
            updateLastUpdated();
            saveToLocal();
            renderDashboard();
        }

        function copyPropagationSMS() {
            let text = "🌱 P7 GENETIC CATALOG — PROPAGATION READY LIST\n\n";
            const readyMothers = mothers.filter(m => m.status === "Active" && getDaysSinceClone(m) !== null && getDaysSinceClone(m) > 30);
            if (readyMothers.length) {
                text += "MOTHERS READY FOR SNIPS:\n";
                readyMothers.forEach(m => {
                    const gen = genetics.find(g => g.id === m.geneticId) || {name:''};
                    text += `• ${m.tag} — ${gen.name}\n`;
                });
                text += "\n";
            }
            clonePhases.forEach(phase => {
                const inPhase = clones.filter(c => !c.isArchived && c.status === phase);
                if (inPhase.length) {
                    text += `${phase.toUpperCase()} PHASE:\n`;
                    inPhase.forEach(c => {
                        const genetic = genetics.find(g => g.id === c.geneticId) || {name: 'Unknown'};
                        const isMultiMom = (c.sourceMothers && c.sourceMothers.length > 1);
                        const displayName = genetic.name + (isMultiMom ? ` (Multi)` : '');
                        const qtyBreakdown = c.quantityBreakdown ? Object.entries(c.quantityBreakdown).map(([m,q]) => `${m}: ${q}`).join(' + ') : c.quantity;
                        text += `• ${displayName} ×${c.quantity} (${c.cutDate}) | ${qtyBreakdown} | Purpose: ${c.purpose||'—'}\n`;
                    });
                    text += "\n";
                }
            });
            navigator.clipboard.writeText(text).then(() => alert("✅ Propagation Ready list copied to clipboard!")).catch(() => alert("❌ Clipboard permission needed"));
        }

        function copyAllClonesList() {
            let text = "🌱 P7 CURRENT CLONES — FULL LIST\n\n";
            let count = 0;
            clones.forEach(c => {
                if (c.isArchived) return;
                count++;
                const genetic = genetics.find(g => g.id === c.geneticId) || {name: 'Unknown'};
                const isMultiMom = (c.sourceMothers && c.sourceMothers.length > 1);
                const displayName = genetic.name + (isMultiMom ? ` (Multi-mom: ${c.sourceMothers.join(', ')})` : '');
                const qtyBreakdown = c.quantityBreakdown ? Object.entries(c.quantityBreakdown).map(([m,q]) => `${m}: ${q}`).join(' + ') : c.quantity;
                text += `Batch #${c.id} — ${displayName}\nPhase: ${c.status} | Qty: ${c.quantity} | Cut: ${c.cutDate}\nBreakdown: ${qtyBreakdown} | Purpose: ${c.purpose || '—'}\n\n`;
            });
            if (count === 0) text += "No active clones at the moment.\n";
            navigator.clipboard.writeText(text).then(() => alert("✅ Current Clones list copied to clipboard!")).catch(() => alert("❌ Clipboard permission needed"));

            const active = clones.filter(c => !c.isArchived && !["Retail", "Flowering", "Replenish Moms"].includes(c.status)).length;
            document.getElementById('active-clones').textContent = active;

            const rare = mothers.filter(m => m.isRare && m.status !== 'Archived').length;

            document.getElementById('orphan-genetics').textContent = orphans;

        function importFile() { document.getElementById('fileInput').click(); }
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const imported = JSON.parse(ev.target.result);
                    genetics = imported.genetics || [];
                    mothers = imported.mothers || [];
                    clones = imported.clones || [];
                    updateLastUpdated();
                    saveToLocal();
                    alert("✅ Import successful!");
                    switchTab(2);
                    renderDashboard();
                } catch(err) { alert("Error importing JSON – file may be corrupted"); }
            };
            reader.readAsText(file);
        });

        function exportFile() {
            const exportData = { genetics, mothers, clones, lastUpdated: lastUpdated ? lastUpdated.toISOString() : new Date().toISOString(), version: "4" };
            const jsonStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([jsonStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `p7-genetic-catalog-v4-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
